name: driftbeacon

x-driftbeacon-env: &driftbeacon-env
  DRIFTBEACON_WEB_DATABASE: /data/web.sqlite3
  DRIFTBEACON_WEB_REPORT_DIR: /data/reports
  DRIFTBEACON_SCAN_WORK_DIR: /work/scans
  DRIFTBEACON_WEB_RETENTION_DAYS: ${DRIFTBEACON_WEB_RETENTION_DAYS:-7}
  DRIFTBEACON_WEB_MAX_QUEUED_SCANS: ${DRIFTBEACON_WEB_MAX_QUEUED_SCANS:-10}
  DRIFTBEACON_WEB_MAX_SCAN_SECONDS: ${DRIFTBEACON_WEB_MAX_SCAN_SECONDS:-300}
  DRIFTBEACON_WEB_MAX_REPOSITORY_BYTES: ${DRIFTBEACON_WEB_MAX_REPOSITORY_BYTES:-157286400}
  DRIFTBEACON_WEB_MAX_REPOSITORY_FILES: ${DRIFTBEACON_WEB_MAX_REPOSITORY_FILES:-8000}
  DRIFTBEACON_WORKER_POLL_SECONDS: ${DRIFTBEACON_WORKER_POLL_SECONDS:-2}
  DRIFTBEACON_WORKER_STALE_SECONDS: ${DRIFTBEACON_WORKER_STALE_SECONDS:-600}

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    build:
      context: .
      target: runtime
    image: driftbeacon:local
    command: ["web", "--host", "0.0.0.0", "--port", "8080", "--output-dir", "/data"]
    environment:
      <<: *driftbeacon-env
      DRIFTBEACON_SCAN_WORK_DIR: /tmp/driftbeacon-web-unused
    volumes:
      - driftbeacon-data:/data
    expose:
      - "8080"
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *hardened

  worker:
    image: driftbeacon:local
    build:
      context: .
      target: runtime
    command: ["worker"]
    environment:
      <<: *driftbeacon-env
      DRIFTBEACON_WORKER_ID: ${DRIFTBEACON_WORKER_ID:-worker-1}
    volumes:
      - driftbeacon-data:/data
      - driftbeacon-work:/work
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 2g
    cpus: "1.50"
    <<: *hardened

  proxy:
    image: caddy:2.8.4-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      DRIFTBEACON_SITE_ADDRESS: ${DRIFTBEACON_SITE_ADDRESS:-http://localhost:8080}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cleanup:
    image: driftbeacon:local
    profiles: ["maintenance"]
    command: ["web-cleanup", "--output-dir", "/data"]
    environment:
      <<: *driftbeacon-env
    volumes:
      - driftbeacon-data:/data
      - driftbeacon-work:/work
    restart: "no"
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.25"
    <<: *hardened

volumes:
  driftbeacon-data:
  driftbeacon-work:
  caddy-data:
  caddy-config:
